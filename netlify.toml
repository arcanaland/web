# The apex site (arcana.land). Base directory is the repo root.
[build]
  publish = "apex"
  command = "lefthook run publishable --job apex --no-auto-install --no-tty"
  ignore = 'test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apex netlify.toml requirements.txt lefthook.yml scripts'

[build.environment]
  # Netlify installs requirements.txt (lefthook) with this Python.
  PYTHON_VERSION = "3.13"
